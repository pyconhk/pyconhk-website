monorepo_root = true

[tools]
bun = "1.3.10"
node = "24.18.0"

[monorepo]
config_roots = [
  "website",
  "cms",
  "website/src/years/*/e2e",
  "e2e",
  "cms/e2e",
  "website/e2e",
]

[task_templates."playwright:e2e"]
description = "Run the complete E2E suite"
run = 'bunx playwright test --config "$E2E_CONFIG"'
env = { E2E_CONFIG = "playwright.config.ts", E2E_BROWSER = "chrome" }

[tasks.install]
description = "Install dependencies for all apps sequentially"
run = """
mise //website:install
mise //cms:install
"""

[tasks.dev]
description = "Start the public website dev server"
run = "mise //website:dev"

[tasks.ci]
description = "Run static checks and all E2E suites"
run = """
mise run check-cms-content
mise //...:check
mise run e2e
"""

[tasks.check-cms-content]
description = "Validate locale-coded Decap content in the working tree or a git ref"
run = "node cms/publication/content.ts"

[tasks.check-cms-release]
description = "Fetch and validate the CMS branch before deployment"
run = """
git fetch origin +refs/heads/cms:refs/remotes/origin/cms
CMS_CONTENT_REF=origin/cms node cms/publication/content.ts
"""

[tasks.preview]
description = "Build and preview the public website locally"
run = "mise //website:preview"

[tasks.e2e]
description = "Run all website, CMS and publishing E2E suites"
depends = ["//website:e2e", "//cms:e2e", "//e2e:e2e"]

[tasks.cloudflare-preview]
description = "Preview with Wrangler Pages for Cloudflare redirect/runtime checks"
run = "mise //website:cloudflare-preview"
