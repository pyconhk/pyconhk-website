name: Build and Upload Website

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      force:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: website-deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: "043801e2f5b9cf2685593bd9098e98b1"
      PROGRAMME_ENVIRONMENT: ${{ inputs.target }}
      NEWS_SOURCE: ${{ vars.NEWS_SOURCE }}
      NEWS_REPOSITORY: pyconhk/pyconhk-news
    steps:
      - name: Validate target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            production) echo 'SOURCE_BRANCH=main' >> "$GITHUB_ENV" ;;
            test) echo 'SOURCE_BRANCH=test' >> "$GITHUB_ENV" ;;
            preview) echo 'SOURCE_BRANCH=alex-dev' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported deployment target' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Check published programme and deployed revision
        id: prepare
        env:
          TARGET: ${{ inputs.target }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(prepare "$TARGET")
          if [ "$FORCE" = true ]; then args+=(--force); fi
          mise exec -- node .github/deploy/website.ts "${args[@]}"
      - name: Require the configured Pages deployment credential
        if: steps.prepare.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_API_TOKEN with Pages Edit access to the PyCon Cloudflare account before enabling uploads.' >&2
            exit 1
          fi
      - name: Check out the pinned News revision
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.news_sha != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.prepare.outputs.news_repo }}
          ref: ${{ steps.prepare.outputs.news_sha }}
          path: news-source
          persist-credentials: false
      - name: Stage only News and uploaded media
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.news_sha != ''
        env:
          EXPECTED_NEWS_SHA: ${{ steps.prepare.outputs.news_sha }}
        run: |
          actual="$(git -C news-source rev-parse HEAD)"
          test "$actual" = "$EXPECTED_NEWS_SHA" || { echo 'News checkout does not match the pinned revision.' >&2; exit 1; }
          test -d news-source/website/outstatic/content/2025-posts || { echo 'News checkout is missing the 2025 posts directory.' >&2; exit 1; }
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ ^website/outstatic/content/2025-posts/[^/]+\.(en|zh-hk|zh-hant|zh-hans|ja)\.mdx$ ]] ||
               [[ "$file" =~ ^website/outstatic/content/2026-posts/[^/]+\.(en|zh-hk|zh-hant|zh-hans|ja|ko)\.mdx$ ]] ||
               [[ "$file" =~ ^website/public/outstatic/images/[^/]+\.(png|jpe?g|webp|avif|gif|svg)$ ]]; then
              continue
            fi
            echo "News checkout contains an unsupported website file: $file" >&2
            exit 1
          done < <(git -C news-source ls-files -z -- website)
          if [ -n "$(find news-source/website -type l -print -quit)" ]; then
            echo 'News content must not contain symlinks.' >&2
            exit 1
          fi
          for year in 2025 2026; do
            rm -rf "website/outstatic/content/${year}-posts"
            if [ -d "news-source/website/outstatic/content/${year}-posts" ]; then
              cp -R "news-source/website/outstatic/content/${year}-posts" "website/outstatic/content/${year}-posts"
            fi
          done
          rm -rf website/public/outstatic/images
          if [ -d news-source/website/public/outstatic/images ]; then
            cp -R news-source/website/public/outstatic/images website/public/outstatic/images
          fi
      - name: Restore dependency cache
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: mise run //website:install
      - name: Validate content and build
        if: steps.prepare.outputs.changed == 'true'
        env:
          PUBLIC_SITE_URL: ${{ inputs.target == 'production' && 'https://pycon.hk' || steps.prepare.outputs.origin }}
          PROGRAMME_OUTPUT_PATH: ${{ steps.prepare.outputs.snapshot_path }}
          PROGRAMME_SOURCE_URL: ${{ steps.prepare.outputs.source_url }}
          PROGRAMME_BASELINE_PATH: ${{ steps.prepare.outputs.baseline_path }}
          PROGRAMME_SOURCE_EVENT: ${{ steps.prepare.outputs.event }}
          NEWS_CHECKOUT_DIR: ${{ steps.prepare.outputs.news_sha != '' && 'news-source' || '' }}
        run: |
          mise exec -- node cms/publication/content.ts
          mise run //website:typecheck
          mise run //website:build
          mise exec -- node .github/deploy/website.ts finalize \
            "${{ steps.prepare.outputs.snapshot_path }}" "${{ steps.prepare.outputs.manifest_path }}"
      - name: Reject a superseded code revision
        if: steps.prepare.outputs.changed == 'true'
        env:
          EXPECTED_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          latest="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$latest" = "$EXPECTED_SHA" || { echo 'Branch advanced; the next queued deployment will build it.' >&2; exit 1; }
      - name: Reject a superseded News revision
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.news_sha != ''
        env:
          EXPECTED_NEWS_SHA: ${{ steps.prepare.outputs.news_sha }}
          NEWS_REF: ${{ steps.prepare.outputs.news_ref }}
        run: |
          latest="$(git ls-remote "https://github.com/${NEWS_REPOSITORY}.git" "$NEWS_REF" | cut -f1)"
          test "$latest" = "$EXPECTED_NEWS_SHA" || { echo 'News branch advanced; the next queued deployment will build it.' >&2; exit 1; }
      - name: Upload website and Pages Functions
        if: steps.prepare.outputs.changed == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ steps.prepare.outputs.project }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: mise exec -- bun x wrangler pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$SOURCE_SHA"
      - name: Verify deployed website
        if: steps.prepare.outputs.changed == 'true'
        env:
          TARGET: ${{ inputs.target }}
          MANIFEST_PATH: ${{ steps.prepare.outputs.manifest_path }}
        run: mise exec -- node .github/deploy/website.ts verify "$TARGET" "$MANIFEST_PATH"
      - name: Summarize
        env:
          TARGET: ${{ inputs.target }}
          CHANGED: ${{ steps.prepare.outputs.changed }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          ORIGIN: ${{ steps.prepare.outputs.origin }}
          NEWS_SHA: ${{ steps.prepare.outputs.news_sha }}
        run: |
          if [ "$CHANGED" = true ]; then
            echo "Verified $TARGET at $ORIGIN (website $SOURCE_SHA, News ${NEWS_SHA:-local})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Website inputs and public programme are unchanged for $TARGET; build and upload skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
