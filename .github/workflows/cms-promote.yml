name: Promote CMS Content

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: CMS publication environment
        type: choice
        options: [both, test, production]
        default: both

permissions:
  contents: read

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - id: select
        env:
          REQUESTED: ${{ inputs.target || 'both' }}
        run: |
          case "$REQUESTED" in
            both) echo 'targets=["test","production"]' >> "$GITHUB_OUTPUT" ;;
            test) echo 'targets=["test"]' >> "$GITHUB_OUTPUT" ;;
            production) echo 'targets=["production"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unknown publication environment.' >&2; exit 1 ;;
          esac
  publish:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    uses: ./.github/workflows/cms-publish-environment.yml
    with:
      target: ${{ matrix.target }}
    secrets: inherit
