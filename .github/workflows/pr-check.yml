name: Pull Request Check

on:
  pull_request:
    branches: [main, test, cms]

permissions:
  contents: read

jobs:
  pull_request_check:
    name: Branch Rules
    if: github.base_ref != 'cms'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR branch rules
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # Rule 1: Only test can merge to main.
          # The cms branch is promoted by the scheduled content workflow, not by PR.
          if [ "$BASE_BRANCH" == "main" ]; then
            if [ "$HEAD_BRANCH" != "test" ]; then
              echo "❌ Error: Only 'test' can merge to 'main'"
              echo "Current source branch: $HEAD_BRANCH"
              echo "Target branch: $BASE_BRANCH"
              echo ""
              echo "Please merge code changes to 'test' first. CMS content is promoted by workflow."
              exit 1
            else
              echo "✅ Valid: $HEAD_BRANCH branch merging to main"
            fi

          # Rule 2: Only validated Decap editorial content can merge to cms.
          elif [ "$BASE_BRANCH" == "cms" ]; then
            echo "Validated same-repository Decap editorial content targeting cms."

          # Rule 3: All other branches must merge to test
          elif [ "$BASE_BRANCH" != "test" ]; then
            echo "❌ Error: All feature branches must merge to 'test'"
            echo "Current source branch: $HEAD_BRANCH"
            echo "Target branch: $BASE_BRANCH"
            echo ""
            echo "Please change your pull request target to 'test' branch"
            exit 1

          # Valid case: Merging to test
          else
            echo "✅ Valid: PR targeting 'test' from '$HEAD_BRANCH'"
            echo "This follows the correct branching strategy"
          fi


  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Validate CMS operations policy
        run: mise run validate-cms-ops

      - name: Validate deployable CMS branch content
        run: mise run check-cms-release

      - name: Check website and CMS
        run: mise run '//...:check'

      - name: Build website
        run: mise run '//website:build'

      - name: Validate Cloudflare Worker package
        run: mise run '//cms:deploy-dry-run'

      - name: Install Playwright browser
        working-directory: website
        run: mise exec -- bunx playwright install chromium

      - name: Run website e2e smoke tests
        run: mise run '//website:e2e'
