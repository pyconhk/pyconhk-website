name: Pull Request Check

on:
  pull_request:
    branches: [main, test, cms]
  workflow_call:
    inputs:
      ref:
        description: Exact CMS merge candidate commit to validate
        type: string
        default: ''
      cms_base:
        description: Published target branch (main or test)
        type: string
        default: ''
      cms_head:
        description: Reserved CMS publication branch for the target
        type: string
        default: ''
      cms_base_sha:
        description: Exact target commit used to prepare the candidate
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || format('{0}-{1}', inputs.cms_base || github.ref, inputs.ref || github.sha) }}
  cancel-in-progress: true

jobs:
  pull_request_check:
    name: Branch Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check PR branch rules
        env:
          CMS_CI_MODE: ${{ inputs.ref != '' }}
          CMS_PR_BASE: ${{ inputs.cms_base || github.base_ref }}
          CMS_PR_HEAD: ${{ inputs.cms_head || github.head_ref }}
          CMS_PR_BASE_REPO: ${{ github.repository }}
          CMS_PR_HEAD_REPO: ${{ inputs.ref && github.repository || github.event.pull_request.head.repo.full_name }}
          CMS_PR_BASE_SHA: ${{ inputs.cms_base_sha || github.event.pull_request.base.sha }}
          CMS_PR_HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
        run: |
          if [ "$CMS_CI_MODE" = true ]; then
            # A CMS candidate cannot replace the checker that approves itself.
            # Extract both helpers from the immutable, reviewed target commit.
            [[ "$CMS_PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$CMS_PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            test "$(git rev-parse HEAD)" = "$CMS_PR_HEAD_SHA"
            checker_dir="$(mktemp -d "$RUNNER_TEMP/cms-branch-rules.XXXXXX")"
            trap 'rm -rf "$checker_dir"' EXIT
            for helper in branches promotion; do
              git show "$CMS_PR_BASE_SHA:cms/publication/$helper.ts" > "$checker_dir/$helper.ts"
            done
            node "$checker_dir/branches.ts"
          else
            node cms/publication/branches.ts
          fi


  discover:
    name: Discover E2E suites
    needs: pull_request_check
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - id: suites
        run: |
          mise tasks ls --all --json > /tmp/tasks.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const tasks = JSON.parse(fs.readFileSync('/tmp/tasks.json', 'utf8'));
          const directories = fs.globSync('**/e2e/mise.toml', { exclude: ['**/node_modules/**', '**/.git/**'] });
          const suites = directories.flatMap(file => {
            const dir = path.dirname(file);
            const task = `//${dir}:e2e`;
            const definition = tasks.find(candidate => candidate.name === task);
            if (!definition) throw new Error(`Unregistered E2E task: ${task}`);
            const configuredShards = definition.env.find(value => value.startsWith('E2E_SHARDS='))?.slice('E2E_SHARDS='.length) ?? '1';
            const shardTotal = Number(configuredShards);
            if (!/^[1-9]\d*$/.test(configuredShards) || !Number.isSafeInteger(shardTotal) || shardTotal > 256)
              throw new Error(`${file}: E2E_SHARDS must be an integer from 1 to 256`);
            return Array.from({ length: shardTotal }, (_, index) => ({
              name: dir.replaceAll('/', '-') + (shardTotal > 1 ? `-shard-${index + 1}-of-${shardTotal}` : ''),
              task,
              website: dir.startsWith('website/'),
              browser: !definition.env.includes('E2E_BROWSER=none'),
              shardIndex: index + 1,
              shardTotal,
            }));
          });
          if (!suites.length) throw new Error('No E2E suites discovered');
          if (suites.length > 256) throw new Error('E2E shards exceed the GitHub Actions 256-job matrix limit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:suites})}\n`);
          JS

  build:
    name: Build shared website
    needs: pull_request_check
    runs-on: ubuntu-latest
    env:
      PROGRAMME_ENVIRONMENT: test
      PROGRAMME_SOURCE_EVENT: pyconhk2025
      PROGRAMME_SNAPSHOT_PATH: src/years/2026/data/programme/pyconhk2025.public.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock', 'cms/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run //website:install
      - run: mise run //website:build
      - run: tar -cf website-dist.tar -C website dist public/pagefind
      - uses: actions/upload-artifact@v6
        with:
          name: website-dist-${{ inputs.cms_base || 'pr' }}-${{ inputs.ref || github.sha }}
          path: website-dist.tar
          compression-level: 0
          retention-days: 1

  checks:
    name: Type and lint checks
    needs: pull_request_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock', 'cms/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run install
      - run: mise run check-cms-content
      - run: mise run test-deployments
      - run: mise run //...:check

  e2e:
    name: E2E ${{ matrix.name }}
    needs: [discover, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.suites) }}
    env:
      PROGRAMME_ENVIRONMENT: test
      PROGRAMME_SOURCE_EVENT: pyconhk2025
      PROGRAMME_SNAPSHOT_PATH: src/years/2026/data/programme/pyconhk2025.public.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock', 'cms/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run install
      - uses: actions/download-artifact@v7
        if: matrix.website
        with:
          name: website-dist-${{ inputs.cms_base || 'pr' }}-${{ inputs.ref || github.sha }}
      - if: matrix.website
        run: |
          tar -xf website-dist.tar -C website
          echo 'PLAYWRIGHT_SKIP_BUILD=1' >> "$GITHUB_ENV"
      - name: Use runner Chrome
        if: matrix.browser
        run: google-chrome --version
      - name: Run complete E2E suite
        env:
          E2E_TASK: ${{ matrix.task }}
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          E2E_SHARD_TOTAL: ${{ matrix.shardTotal }}
        run: mise run "$E2E_TASK" -- --shard="$E2E_SHARD_INDEX/$E2E_SHARD_TOTAL"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-failures-${{ matrix.name }}-${{ inputs.cms_base || 'pr' }}-${{ inputs.ref || github.sha }}
          path: |
            website/test-results
            cms/test-results
            test-results/publishing
          retention-days: 3

  validate:
    name: Validate Monorepo
    if: always()
    needs: [pull_request_check, discover, build, checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          BRANCH_RULES: ${{ needs.pull_request_check.result }}
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$BRANCH_RULES" = success && test "$DISCOVER" = success && test "$BUILD" = success && test "$CHECKS" = success && test "$E2E" = success
