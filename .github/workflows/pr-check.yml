name: Pull Request Check

on:
  pull_request:
    branches: [main, test, cms]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull_request_check:
    name: Branch Rules
    if: github.base_ref != 'cms'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR branch rules
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # Rule 1: Only test can merge to main.
          # The cms branch is promoted by the scheduled content workflow, not by PR.
          if [ "$BASE_BRANCH" == "main" ]; then
            if [ "$HEAD_BRANCH" != "test" ]; then
              echo "❌ Error: Only 'test' can merge to 'main'"
              echo "Current source branch: $HEAD_BRANCH"
              echo "Target branch: $BASE_BRANCH"
              echo ""
              echo "Please merge code changes to 'test' first. CMS content is promoted by workflow."
              exit 1
            else
              echo "✅ Valid: $HEAD_BRANCH branch merging to main"
            fi

          # Rule 2: Only validated Decap editorial content can merge to cms.
          elif [ "$BASE_BRANCH" == "cms" ]; then
            echo "Validated same-repository Decap editorial content targeting cms."

          # Rule 3: All other branches must merge to test
          elif [ "$BASE_BRANCH" != "test" ]; then
            echo "❌ Error: All feature branches must merge to 'test'"
            echo "Current source branch: $HEAD_BRANCH"
            echo "Target branch: $BASE_BRANCH"
            echo ""
            echo "Please change your pull request target to 'test' branch"
            exit 1

          # Valid case: Merging to test
          else
            echo "✅ Valid: PR targeting 'test' from '$HEAD_BRANCH'"
            echo "This follows the correct branching strategy"
          fi


  build:
    name: Build shared website
    runs-on: ubuntu-latest
    env:
      PROGRAMME_ENVIRONMENT: test
      PROGRAMME_SOURCE_EVENT: pyconhk2025
      PROGRAMME_SNAPSHOT_PATH: src/years/2026/data/programme/pyconhk2025.public.json
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run //website:install
      - run: mise run //website:build
      - run: tar -cf website-dist.tar -C website dist public/pagefind
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website-dist.tar
          compression-level: 0
          retention-days: 1

  unit:
    name: Unit tests and CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run install
      - run: mise run validate-cms-ops
      - run: mise run check-cms-release
      - run: mise run //website:typecheck
      - run: mise run //website:lint
      - run: mise exec -- bun --cwd website run test:unit
      - run: mise run //cms:check
      - run: mise run //cms:deploy-dry-run

  year:
    name: Test ${{ matrix.year }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: ['2015', '2016', '2017', '2018', '2020', '2021', '2022', '2023', '2024', '2025', '2026', common]
    env:
      TEST_YEAR: ${{ matrix.year }}
      PROGRAMME_ENVIRONMENT: test
      PROGRAMME_SOURCE_EVENT: pyconhk2025
      PROGRAMME_SNAPSHOT_PATH: src/years/2026/data/programme/pyconhk2025.public.json
      PLAYWRIGHT_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise run //website:install
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
      - run: tar -xf website-dist.tar -C website
      - name: Check built routes
        working-directory: website
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/legacy-${TEST_YEAR}-*contract.test.ts)
          if [ "$TEST_YEAR" = common ]; then tests=(tests/event-scope-contract.test.ts tests/legacy-search-route-contract.test.ts); fi
          if [ "$TEST_YEAR" = 2026 ]; then tests=(tests/programme-build.test.ts); fi
          if [ "${#tests[@]}" -gt 0 ]; then mise exec -- bun test "${tests[@]}"; fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock') }}
      - name: Install browser and system dependencies
        working-directory: website
        run: mise exec -- bunx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: website
        run: mise exec -- bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures-${{ matrix.year }}
          path: website/test-results
          retention-days: 3

  validate:
    name: Validate Monorepo
    if: always()
    needs: [build, unit, year]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          YEARS: ${{ needs.year.result }}
        run: test "$BUILD" = success && test "$UNIT" = success && test "$YEARS" = success
