name: Pull Request Check

on:
  pull_request:
    branches: [main, test, cms]

jobs:
  pull_request_check:
    name: Branch Rules
    runs-on: ubuntu-latest
    steps:
      - name: Check PR branch rules
        run: |
          # Rule 1: Only test can merge to main.
          # The cms branch is promoted by the scheduled content workflow, not by PR.
          if [ "${{ github.base_ref }}" == "main" ]; then
            if [ "${{ github.head_ref }}" != "test" ]; then
              echo "❌ Error: Only 'test' can merge to 'main'"
              echo "Current source branch: ${{ github.head_ref }}"
              echo "Target branch: ${{ github.base_ref }}"
              echo ""
              echo "Please merge code changes to 'test' first. CMS content is promoted by workflow."
              exit 1
            else
              echo "✅ Valid: ${{ github.head_ref }} branch merging to main"
            fi

          # Rule 2: No branch can merge to cms
          elif [ "${{ github.base_ref }}" == "cms" ]; then
            echo "❌ Error: No branches can merge to 'cms'"
            echo "Current source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            echo ""
            echo "The 'cms' branch is protected and should only be modified through the CMS interface"
            exit 1

          # Rule 3: All other branches must merge to test
          elif [ "${{ github.base_ref }}" != "test" ]; then
            echo "❌ Error: All feature branches must merge to 'test'"
            echo "Current source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            echo ""
            echo "Please change your pull request target to 'test' branch"
            exit 1

          # Valid case: Merging to test
          else
            echo "✅ Valid: PR targeting 'test' from '${{ github.head_ref }}'"
            echo "This follows the correct branching strategy"
          fi

  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Validate CMS operations policy
        run: mise run validate-cms-ops

      - name: Check website and CMS
        run: mise run '//...:check'

      - name: Build website and CMS
        run: mise run '//...:build'

      - name: Install Playwright browser
        working-directory: website
        run: mise exec -- bunx playwright install chromium

      - name: Run website e2e smoke tests
        run: mise run '//website:e2e'
