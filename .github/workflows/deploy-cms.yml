name: Deploy CMS

on:
  push:
    branches: [main]
    paths:
      - cms/**
      - package.json
      - bun.lock
      - mise.toml
      - .github/deploy/cms.ts
      - .github/deploy/source.ts
      - .github/workflows/deploy-cms.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when CMS inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cms-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production CMS
    # A manual run must also use the production workflow, never a PR branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "043801e2f5b9cf2685593bd9098e98b1"
      CMS_DEPLOY_ORIGIN: https://pyconhk-cms.website-pyconhk.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'website/bun.lock', 'cms/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: mise run //cms:install
      - name: Build, upload and verify CMS when changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CMS_API_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_CMS_API_TOKEN with Worker deployment access to the PyCon Cloudflare account.' >&2
            exit 1
          fi
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          mise exec -- node .github/deploy/cms.ts "${args[@]}"
      - name: Summarize
        run: |
          echo "CMS inputs checked against $CMS_DEPLOY_ORIGIN. Changed inputs were built, uploaded and verified; unchanged inputs skipped build and upload." >> "$GITHUB_STEP_SUMMARY"
