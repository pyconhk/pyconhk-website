name: Deploy Website
run-name: "${{ inputs.inspect_access && 'Inspect existing deployment access' || (github.event_name == 'schedule' && 'Fallback website polling' || format('Deploy Website [{0}] {1}', inputs.target || (github.ref_name == 'main' && 'production' || (github.ref_name == 'test' && 'test' || 'preview')), inputs.reconcile_id || '')) }}"

on:
  push:
    branches: [main, test, alex-dev]
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      deploy_reconciler:
        description: Upload disabled reconciler using existing authorized deployment access
        type: boolean
        default: false
      inspect_access:
        description: Read existing deployment credential policy without deploying
        type: boolean
        default: false
      target:
        description: Website to update
        type: choice
        options: [test, production, preview]
        default: test
      repair_completion:
        description: Retry verification or invalidation of already uploaded content
        type: boolean
        default: false
      reconcile_id:
        description: Correlation ID from content reconciliation
        type: string
        default: ''
      force:
        description: Rebuild even when code and programme are unchanged
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy_reconciler:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_reconciler && vars.CONTENT_RECONCILIATION_ENABLED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-disabled-reconciler
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Install existing deployment tools
        run: mise run //website:install
      - name: Require the disabled rollout configuration
        run: |
          mise exec -- node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('reconciler/wrangler.jsonc', 'utf8'));
          assert.equal(config.vars.ENABLED, 'false');
          assert.equal(config.account_id, '043801e2f5b9cf2685593bd9098e98b1');
          JS
      - name: Upload disabled reconciler without configuring credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: mise exec -- bun x wrangler deploy --config reconciler/wrangler.jsonc
  inspect_access:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Read existing Cloudflare deployment credential policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deploy/access.ts
  select:
    # Keep existing polling until the approved Worker is active.
    if: inputs.inspect_access != true && inputs.deploy_reconciler != true && (github.event_name != 'schedule' || vars.CONTENT_RECONCILIATION_ENABLED != 'true')
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo 'targets=["test","production"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = main ]; then
            echo 'targets=["production"]' >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = test ]; then
            echo 'targets=["test"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["preview"]' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/deploy-website-reusable.yml
    with:
      target: ${{ matrix.target }}
      repair_completion: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_completion || false }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
