[tools]
bun = "1.3.10"
node = "24.18.0"

[tasks.install]
description = "Install CMS dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the CMS dev server"
run = "bun run dev"

[tasks.build]
description = "Build the CMS app"
run = "bun run build"

[tasks.preview]
description = "Build and preview the CMS app locally"
run = """
bun run build
bun run preview
"""

[tasks.deploy-dry-run]
description = "Build and validate the Cloudflare Worker bundle"
run = "bun run deploy:dry-run"

[tasks.deploy]
description = "Build and deploy the CMS to Cloudflare Workers"
run = "bun run deploy"

[tasks.types]
description = "Generate Cloudflare Worker binding types"
run = "bun run types"

[tasks.e2e]
description = "Run the complete CMS E2E suite"
run = "mise //cms/e2e:e2e"

[tasks.check]
description = "Run CMS type and lint checks"
run = "bun run check && bun run lint"

[tasks.lint]
description = "Lint the CMS app"
run = "bun run lint"

[tasks.format]
description = "Format the CMS app"
run = "bun run format"

[tasks.local-backend]
description = "Start the Decap local backend"
run = "bun run cms:local-backend"
