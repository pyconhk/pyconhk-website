[tools]
bun = "1.3.10"
node = "24.18.0"

[tasks.install]
description = "Install public website dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the public website dev server"
run = "bun run dev"

[tasks.build]
description = "Build the public website"
run = "bun run build"

[tasks.preview]
description = "Build and preview the public website locally"
run = """
bun run build
bun run preview -- --host 127.0.0.1 --port 8788
"""

[tasks.cloudflare-preview]
description = "Build and preview the public website through Wrangler Pages"
run = """
bun run build
bunx wrangler pages dev dist --local --ip 127.0.0.1 --port 8788
"""

[tasks.e2e]
description = "Run public website Playwright e2e tests through Wrangler Pages"
run = "bun run e2e"

[tasks.check]
description = "Check the public website"
run = "bun run check"

[tasks.typecheck]
description = "Run Astro type checking for the public website"
run = "bun run typecheck"

[tasks.lint]
description = "Lint the public website"
run = "bun run lint"

[tasks.lint-fix]
description = "Apply safe public website lint fixes"
run = "bun run lint:fix"

[tasks.format]
description = "Format the public website"
run = "bun run format"

[tasks.format-check]
description = "Verify public website formatting"
run = "bun run format:check"
